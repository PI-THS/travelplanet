<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- iPhone Safari 冇 element fullscreen API：由「分享 → 加入主畫面」開就會冇工具列（同旅款亂Upper 一樣）-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>真．旅遊星球</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#bde7ff;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body{font:15px/1.6 -apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;color:#5a4632;}
button{font:inherit;cursor:pointer;}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;}
#cv{display:block;width:100%;height:100%;}
.pill{background:rgba(255,250,235,.95);color:#5a4632;border:none;border-radius:999px;padding:5px 14px;font-size:14px;line-height:1.5;box-shadow:0 2px 0 rgba(90,70,50,.14);white-space:nowrap;}
button.pill:active{transform:translateY(1px);}
#hudL{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:5;}
/* 畫面上方掣：奶油色立體按鈕＋three.js 立體圖示 */
.hb{border:none;font:inherit;color:#5a4632;background:linear-gradient(180deg,#fffdf7 0%,#f5ead3 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 3px 0 #d9c49c,0 7px 16px rgba(70,50,30,.22);-webkit-tap-highlight-color:transparent;cursor:pointer;}
.hb .ic{display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;}
.hb.money{display:flex;align-items:center;gap:6px;height:46px;padding:0 18px 0 6px;border-radius:23px;font-weight:800;font-size:19px;letter-spacing:.5px;font-variant-numeric:tabular-nums;cursor:default;}
.hb.money .ic{width:38px;height:38px;}
.hb.sq{position:relative;width:60px;height:60px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.hb.sq .ic{width:38px;height:38px;margin-top:-1px;}
.hb.sq span{font-size:11.5px;font-weight:800;line-height:1;margin-top:1px;letter-spacing:1px;}
button.hb:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 1px 0 #d9c49c,0 3px 8px rgba(70,50,30,.2);}
/* 拖動移動：手指開始位置有淡淡圓圈（放手就消失） */
#tring,#tdot{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s;}
#tring{width:80px;height:80px;box-sizing:border-box;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);}
#tdot{width:28px;height:28px;background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(0,0,0,.15);}
#app.drag #tring,#app.drag #tdot{opacity:1;}
#hudL .row,#hudR .row{display:flex;gap:6px;}
#hudR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:row;align-items:flex-start;gap:8px;z-index:5;}
#bphone{position:relative;}
#badge{display:none;position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#ef5b4c;color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px;font-style:normal;}
#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8;width:max-content;max-width:92vw;}
.toast{background:rgba(90,70,50,.9);color:#fffaeb;border-radius:999px;padding:6px 16px;font-size:14px;animation:tin .25s ease-out;transition:opacity .4s;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
#abtn{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;background:#f4c542;color:#5a3e00;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #c99a1e;z-index:4;padding:0;}
#abtn b{font-size:28px;line-height:1;}
#abtn span{font-size:13px;line-height:1.3;}
#abtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a1e;}
#hint{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 300px);background:rgba(90,70,50,.82);color:#fffaeb;border-radius:14px;padding:6px 14px;font-size:13px;text-align:center;pointer-events:none;transition:opacity .6s;z-index:3;}
#dlg{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:7;}
#dlgO{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:6px;}
#dlgO button{background:#fffaeb;color:#5a4632;border:2px solid #f4c542;border-radius:999px;padding:6px 18px;font-size:15px;min-width:170px;}
#dlgO button:disabled{opacity:.45;}
#dlgN{display:inline-block;margin-left:22px;padding:3px 16px;border-radius:999px;font-size:14px;font-weight:600;position:relative;top:12px;z-index:1;}
#dlgB{background:#fffaeb;color:#5a4632;border-radius:26px;padding:22px 26px 20px;font-size:16px;line-height:1.75;min-height:84px;position:relative;box-shadow:0 6px 0 rgba(90,70,50,.15);}
#dlgA{position:absolute;right:20px;bottom:8px;color:#e0a526;font-size:13px;}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,94vw);max-height:min(86vh,700px);background:#fffaeb;border-radius:26px;box-shadow:0 8px 0 rgba(90,70,50,.22);display:none;flex-direction:column;z-index:9;overflow:hidden;}
#panel.on{display:flex;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 8px;}
.ph h2{margin:0;font-size:19px;line-height:1.4;}
.ph .sub{font-size:13px;color:#8a7560;}
.x{border:none;background:#f1e6c8;border-radius:50%;width:38px;height:38px;font-size:18px;color:#5a4632;flex:none;}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap;}
.tab{border:none;border-radius:999px;padding:6px 16px;background:#f1e6c8;color:#5a4632;}
.tab.on{background:#f4c542;color:#4a3000;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.chip{border:2px solid #f1e6c8;background:#fff;border-radius:999px;padding:4px 14px;color:#5a4632;}
.chip.on{border-color:#f4c542;background:#fff4cf;}
.pb{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.note{font-size:13px;color:#8a7560;margin:0 2px 10px;line-height:1.6;}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;}
.card.cur{box-shadow:inset 0 0 0 3px #f4c542;}
.sw{width:54px;height:54px;border-radius:12px;flex:none;background:#f3eee2 center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;}
.sw.ico{background-color:#f6efe0;background-position:center;background-size:84%;background-repeat:no-repeat;}
.sico{width:20px;height:20px;vertical-align:-5px;margin-right:3px;display:inline-block;}
.ci{flex:1;min-width:0;}
.ci b{display:block;font-size:15px;}
.ci small{display:block;color:#8a7560;font-size:13px;line-height:1.55;}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52%;}
.act{border:none;border-radius:999px;padding:7px 13px;background:#7fc66e;color:#fff;white-space:nowrap;font-size:14px;}
.act.o{background:#f4a53c;}
.act.g{background:#b9ad96;}
.act:disabled{background:#e4dccb;color:#fff;cursor:default;}
.ok{color:#3f8f2f;}.bad{color:#c9503f;}.lock{color:#9a8a74;}
.stars{color:#f0a820;letter-spacing:1px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:10px;align-items:center;}
.kv span:nth-child(odd){color:#8a7560;}
#bmag{position:relative;}#bmag.dot:after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ef5b4c;box-shadow:0 0 0 2px #fffaeb;}
#firehud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:6;display:none;background:#c9503f;color:#fff;font-weight:700;animation:fpulse 1s ease-in-out infinite;}@keyframes fpulse{50%{background:#e8793f;}}
.magcv{background:linear-gradient(135deg,#2f5d8a,#6f82d9 60%,#f4a53c);color:#fffaeb;border-radius:18px;padding:16px 18px;margin:0 0 10px;box-shadow:inset 0 -40px 60px rgba(0,0,0,.12);}
.mgk{font-size:12px;letter-spacing:3px;opacity:.9;}.mgt{font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;font-weight:900;font-size:26px;line-height:1.3;margin:2px 0;}.mgs{font-size:14px;}.magcv .stars{color:#ffd54a;}
.rv{background:#fff;border-radius:14px;padding:10px 13px;margin:0 0 8px;}.rvh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}.rvh b{font-size:15px;}.rvh small{color:#8a7560;font-size:12px;}.rvh .stars{margin-left:auto;}
.rvt{font-size:14px;line-height:1.65;margin-top:3px;}.rvg{font-size:12px;color:#8a7560;margin-top:4px;}
.bt{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px;}.bts{flex:1;min-width:60px;text-align:center;font-size:13px;padding:6px 4px;border-radius:10px;background:#f1e6c8;color:#8a7560;}.bts.on{background:#f4a53c;color:#fff;font-weight:700;}
.cond{background:#fff;border-radius:12px;padding:7px 12px;margin:0 0 6px;font-size:14px;}.cond.ok{background:#e9f6e2;}
#login{position:absolute;inset:0;display:none;z-index:15;background:rgba(40,30,20,.25);}#login.on{display:block;}#login .mk{left:50%;right:auto;transform:translate(-50%,-50%);}.lgrow{display:flex;gap:10px;}.lgrow label,.lgrow button{flex:1;}.lgg{background:#fff!important;color:#5a4632!important;box-shadow:0 3px 0 #e1d6bb!important;}.lgu{background:#7fc66e!important;box-shadow:0 3px 0 #5a9e4a!important;}
@media (max-width:700px) and (orientation:portrait){#login .mk{left:12px;right:12px;transform:none;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));}}
#visitbar{position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(111,130,217,.95);color:#fff;border-radius:999px;padding:5px 6px 5px 14px;z-index:6;font-size:14px;white-space:nowrap;}#visitbar.on{display:flex;}
#tip{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,30,20,.35);z-index:20;}#tip.on{display:flex;}.tipb{background:#fffaeb;border-radius:20px;padding:18px 20px;width:min(360px,88vw);box-shadow:0 8px 0 rgba(90,70,50,.22);}.tipb b{font-size:18px;}#tipX{margin:8px 0 4px;font-size:15px;line-height:1.7;}
.info{border:none;background:#6f82d9;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;font-weight:700;line-height:22px;padding:0;margin-left:4px;vertical-align:middle;}
.pq{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:17px;}.pq input{width:120px;font:inherit;font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid #f4c542;user-select:text;-webkit-user-select:text;}
#fade{position:absolute;inset:0;background:#fffaeb;opacity:0;pointer-events:none;transition:opacity .28s;z-index:30;}
/* 背包格仔 */
.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px;}
.slot{aspect-ratio:1;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1.1;position:relative;box-shadow:0 2px 0 rgba(90,70,50,.08);}
.slico{width:62%;height:62%;object-fit:contain;display:block;pointer-events:none;}
.slot small{font-size:10px;color:#8a7560;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;max-width:100%;}
.slot i{position:absolute;right:6px;top:3px;font-size:12px;font-style:normal;color:#5a4632;font-weight:700;}
.slot.empty{background:#f3eee2;box-shadow:inset 0 0 0 2px #e9dfc9;}
/* 角色設定（開局／更改外觀）*/
#make{position:absolute;inset:0;display:none;z-index:12;pointer-events:none;}
#make.on{display:block;}
.mk{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:#fffaeb;border-radius:26px;box-shadow:0 8px 0 rgba(90,70,50,.22);padding:18px 18px 16px;pointer-events:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
.mk h2{margin:0 0 4px;font-size:19px;}
.mk .sub{font-size:13px;color:#8a7560;margin:0 0 10px;}
.mk label{display:block;font-size:14px;margin:8px 0 4px;color:#8a7560;}
.mk input{width:100%;font:inherit;font-size:17px;padding:8px 14px;border-radius:14px;border:2px solid #f1e6c8;background:#fff;color:#5a4632;user-select:text;-webkit-user-select:text;}
.mk input:focus{outline:none;border-color:#f4c542;}
.mkerr{min-height:20px;font-size:13px;color:#c9503f;margin-top:4px;}
.sws{display:flex;gap:8px;flex-wrap:wrap;}
.swb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9dfc9;padding:0;}
.swb.on{box-shadow:0 0 0 3px #f4c542;}
.mk .chips{margin:0;}
button{touch-action:manipulation;}
.mkgo{display:block;width:100%;margin-top:14px;border:none;border-radius:999px;padding:10px;background:#f4a53c;color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 0 #c9822a;}
.mkno{display:block;width:100%;margin-top:6px;border:none;background:none;color:#8a7560;font-size:14px;padding:6px;}
.making #tring,.making #tdot,.making #abtn,.making #hudL,.making #hudR,.making #hint,.making #toasts{display:none!important;}
.cover #tring,.cover #tdot,.cover #abtn,.cover #hudL,.cover #hudR,.cover #hint,.cover #toasts,.cover #dlg{display:none!important;}
/* 封面 */
#cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;z-index:13;padding:calc(8vh + env(safe-area-inset-top)) 16px calc(7vh + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,250,235,0) 45%,rgba(255,250,235,.6));}
#cover.on{display:flex;}
.cv-logo{text-align:center;animation:cvIn .9s ease-out;}
.cv-planet{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f4c542 45%,#e0901f);position:relative;box-shadow:0 6px 0 rgba(90,70,50,.25);animation:cvFloat 3.2s ease-in-out infinite;}
.cv-planet:after{content:'';position:absolute;left:-26px;right:-26px;top:36px;height:22px;border:6px solid #ff85bd;border-radius:50%;transform:rotate(-14deg);box-sizing:border-box;}
.cv-sub{font-size:15px;font-weight:700;color:#fffaeb;letter-spacing:4px;text-shadow:0 2px 0 #6a4a2a,2px 0 0 #6a4a2a,-2px 0 0 #6a4a2a,0 -2px 0 #6a4a2a;}
.cv-logo h1{margin:4px 0 0;font-size:clamp(44px,11vw,88px);line-height:1.1;font-weight:900;color:#fffaeb;letter-spacing:4px;
 text-shadow:0 7px 0 #c9822a,4px 4px 0 #6a4a2a,-4px 4px 0 #6a4a2a,4px -4px 0 #6a4a2a,-4px -4px 0 #6a4a2a,0 5px 0 #6a4a2a,5px 0 0 #6a4a2a,-5px 0 0 #6a4a2a,0 -5px 0 #6a4a2a;}
.cv-go{border:none;border-radius:999px;padding:14px 46px;background:#f4a53c;color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 #c9822a;animation:cvPulse 1.6s ease-in-out infinite;}
.cv-go:active{transform:translateY(3px);box-shadow:0 2px 0 #c9822a;}
.cv-hint{margin-top:10px;font-size:13px;color:#6a4a2a;text-align:center;}
.cv-login{display:block;margin:10px auto 0;border:none;border-radius:999px;padding:8px 20px;background:rgba(255,250,235,.92);color:#5a4632;font-size:15px;box-shadow:0 3px 0 rgba(90,70,50,.18);}
@keyframes cvIn{from{opacity:0;transform:translateY(-20px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes cvFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes cvPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
/* 揀地形 */
#terr{position:absolute;inset:0;display:none;z-index:12;pointer-events:none;}
#terr.on{display:block;}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px;}
.tc{border:none;background:#fff;border-radius:14px;padding:8px 2px 6px;color:#5a4632;font-size:13px;line-height:1.3;box-shadow:0 2px 0 rgba(90,70,50,.1);}
.tc b{display:block;font-size:26px;line-height:1.2;font-weight:400;}
.tc img{display:block;width:46px;height:46px;margin:0 auto 3px;border-radius:9px;image-rendering:pixelated;}
#terr .mk{padding:14px 14px 12px;}#terr .mk .sub{margin-bottom:4px;}#terr .ti{padding:8px 12px;font-size:13px;line-height:1.6;}#terr .mkgo{margin-top:10px;padding:8px;}
@media (max-width:700px) and (orientation:portrait){#terr .mk{max-height:60%;}}
.tc.on{background:#fff4cf;box-shadow:inset 0 0 0 3px #f4c542;}
.ti{background:#fff;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.7;}
.ti small{display:block;color:#8a7560;font-size:13px;}
@media (max-width:700px) and (orientation:portrait){#cover{justify-content:space-around;}}

@media (max-width:700px) and (orientation:portrait){.mk{left:12px;right:12px;width:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:none;max-height:56%;}}
@media (max-width:600px){#hint{display:none;}.hb.sq{width:56px;height:56px;border-radius:18px;}.hb.sq .ic{width:35px;height:35px;}.hb.money{height:44px;font-size:18px;}.hb.money .ic{width:36px;height:36px;}#hudR{gap:7px;}#toasts{top:calc(80px + env(safe-area-inset-top));}.pill{font-size:13px;padding:4px 11px;}#abtn{width:78px;height:78px;}.btns{max-width:58%;}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hudL"><div class="hb money" id="money"><img class="ic" data-ico="coin" alt=""><span id="coins">0</span></div></div>
<div id="hudR"><button class="hb sq" id="bcam" aria-label="鏡頭角度"><img class="ic" data-ico="cam" alt=""><span>角度</span></button><button class="hb sq" id="bmag" aria-label="旅遊雜誌"><img class="ic" data-ico="mag" alt=""><span>雜誌</span></button><button class="hb sq" id="bphone" aria-label="背包"><img class="ic" data-ico="pack" alt=""><span>背包</span><i id="badge"></i></button></div>
<div class="pill" id="firehud"></div>
<div id="toasts"></div>
<div id="hint">方向鍵／WASD 或按住畫面拖動來移動　空白鍵或 A 按鈕互動　C 切換鏡頭角度</div>
<div id="tring"></div><div id="tdot"></div>
<button id="abtn"><b>A</b><span id="alab">—</span></button>
<div id="dlg"><div id="dlgO"></div><div id="dlgN"></div><div id="dlgB"><span id="dlgT"></span><span id="dlgA"></span></div></div>
