<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- iPhone Safari 冇 element fullscreen API：由「分享 → 加入主畫面」開就會冇工具列（同旅款亂Upper 一樣）-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>真．旅遊星球</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#bde7ff;}
body{font:15px/1.6 -apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;color:#5a4632;}
button{font:inherit;cursor:pointer;}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;}
#cv{display:block;width:100%;height:100%;}
.pill{background:rgba(255,250,235,.95);color:#5a4632;border:none;border-radius:999px;padding:5px 14px;font-size:14px;line-height:1.5;box-shadow:0 2px 0 rgba(90,70,50,.14);white-space:nowrap;}
button.pill:active{transform:translateY(1px);}
#hudL{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:5;}
#hudL .row,#hudR .row{display:flex;gap:6px;}
#hudR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:5;}
#bphone{position:relative;}
#badge{display:none;position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#ef5b4c;color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px;font-style:normal;}
#toasts{position:absolute;top:calc(96px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8;width:max-content;max-width:92vw;}
.toast{background:rgba(90,70,50,.9);color:#fffaeb;border-radius:999px;padding:6px 16px;font-size:14px;animation:tin .25s ease-out;transition:opacity .4s;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
#joy{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.8);touch-action:none;z-index:4;}
#knob{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);pointer-events:none;}
#abtn{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;background:#f4c542;color:#5a3e00;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #c99a1e;z-index:4;padding:0;}
#abtn b{font-size:28px;line-height:1;}
#abtn span{font-size:13px;line-height:1.3;}
#abtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a1e;}
#hint{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 300px);background:rgba(90,70,50,.82);color:#fffaeb;border-radius:14px;padding:6px 14px;font-size:13px;text-align:center;pointer-events:none;transition:opacity .6s;z-index:3;}
#dlg{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:7;}
#dlgO{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:6px;}
#dlgO button{background:#fffaeb;color:#5a4632;border:2px solid #f4c542;border-radius:999px;padding:6px 18px;font-size:15px;min-width:170px;}
#dlgO button:disabled{opacity:.45;}
#dlgN{display:inline-block;margin-left:22px;padding:3px 16px;border-radius:999px;font-size:14px;font-weight:600;position:relative;top:12px;z-index:1;}
#dlgB{background:#fffaeb;color:#5a4632;border-radius:26px;padding:22px 26px 20px;font-size:16px;line-height:1.75;min-height:84px;position:relative;box-shadow:0 6px 0 rgba(90,70,50,.15);}
#dlgA{position:absolute;right:20px;bottom:8px;color:#e0a526;font-size:13px;}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,94vw);max-height:min(86vh,700px);background:#fffaeb;border-radius:26px;box-shadow:0 8px 0 rgba(90,70,50,.22);display:none;flex-direction:column;z-index:9;overflow:hidden;}
#panel.on{display:flex;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 8px;}
.ph h2{margin:0;font-size:19px;line-height:1.4;}
.ph .sub{font-size:13px;color:#8a7560;}
.x{border:none;background:#f1e6c8;border-radius:50%;width:38px;height:38px;font-size:18px;color:#5a4632;flex:none;}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap;}
.tab{border:none;border-radius:999px;padding:6px 16px;background:#f1e6c8;color:#5a4632;}
.tab.on{background:#f4c542;color:#4a3000;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.chip{border:2px solid #f1e6c8;background:#fff;border-radius:999px;padding:4px 14px;color:#5a4632;}
.chip.on{border-color:#f4c542;background:#fff4cf;}
.pb{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.note{font-size:13px;color:#8a7560;margin:0 2px 10px;line-height:1.6;}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;}
.card.cur{box-shadow:inset 0 0 0 3px #f4c542;}
.sw{width:54px;height:54px;border-radius:12px;flex:none;background:#f3eee2 center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;}
.ci{flex:1;min-width:0;}
.ci b{display:block;font-size:15px;}
.ci small{display:block;color:#8a7560;font-size:13px;line-height:1.55;}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52%;}
.act{border:none;border-radius:999px;padding:7px 13px;background:#7fc66e;color:#fff;white-space:nowrap;font-size:14px;}
.act.o{background:#f4a53c;}
.act.g{background:#b9ad96;}
.act:disabled{background:#e4dccb;color:#fff;cursor:default;}
.ok{color:#3f8f2f;}.bad{color:#c9503f;}.lock{color:#9a8a74;}
.stars{color:#f0a820;letter-spacing:1px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:10px;align-items:center;}
.kv span:nth-child(odd){color:#8a7560;}
#fade{position:absolute;inset:0;background:#fffaeb;opacity:0;pointer-events:none;transition:opacity .28s;z-index:30;}
/* 背包格仔 */
.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px;}
.slot{aspect-ratio:1;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1.1;position:relative;box-shadow:0 2px 0 rgba(90,70,50,.08);}
.slot small{font-size:10px;color:#8a7560;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;max-width:100%;}
.slot i{position:absolute;right:6px;top:3px;font-size:12px;font-style:normal;color:#5a4632;font-weight:700;}
.slot.empty{background:#f3eee2;box-shadow:inset 0 0 0 2px #e9dfc9;}
/* 角色設定（開局／更改外觀）*/
#make{position:absolute;inset:0;display:none;z-index:12;pointer-events:none;}
#make.on{display:block;}
.mk{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:#fffaeb;border-radius:26px;box-shadow:0 8px 0 rgba(90,70,50,.22);padding:18px 18px 16px;pointer-events:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
.mk h2{margin:0 0 4px;font-size:19px;}
.mk .sub{font-size:13px;color:#8a7560;margin:0 0 10px;}
.mk label{display:block;font-size:14px;margin:8px 0 4px;color:#8a7560;}
.mk input{width:100%;font:inherit;font-size:17px;padding:8px 14px;border-radius:14px;border:2px solid #f1e6c8;background:#fff;color:#5a4632;user-select:text;-webkit-user-select:text;}
.mk input:focus{outline:none;border-color:#f4c542;}
.mkerr{min-height:20px;font-size:13px;color:#c9503f;margin-top:4px;}
.sws{display:flex;gap:8px;flex-wrap:wrap;}
.swb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9dfc9;padding:0;}
.swb.on{box-shadow:0 0 0 3px #f4c542;}
.mk .chips{margin:0;}
.mkgo{display:block;width:100%;margin-top:14px;border:none;border-radius:999px;padding:10px;background:#f4a53c;color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 0 #c9822a;}
.mkno{display:block;width:100%;margin-top:6px;border:none;background:none;color:#8a7560;font-size:14px;padding:6px;}
.making #joy,.making #abtn,.making #hudL,.making #hudR,.making #hint,.making #toasts{display:none!important;}
.cover #joy,.cover #abtn,.cover #hudL,.cover #hudR,.cover #hint,.cover #toasts,.cover #dlg{display:none!important;}
/* 封面 */
#cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;z-index:13;padding:calc(8vh + env(safe-area-inset-top)) 16px calc(7vh + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,250,235,0) 45%,rgba(255,250,235,.6));}
#cover.on{display:flex;}
.cv-logo{text-align:center;animation:cvIn .9s ease-out;}
.cv-planet{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f4c542 45%,#e0901f);position:relative;box-shadow:0 6px 0 rgba(90,70,50,.25);animation:cvFloat 3.2s ease-in-out infinite;}
.cv-planet:after{content:'';position:absolute;left:-26px;right:-26px;top:36px;height:22px;border:6px solid #ff85bd;border-radius:50%;transform:rotate(-14deg);box-sizing:border-box;}
.cv-sub{font-size:15px;font-weight:700;color:#fffaeb;letter-spacing:4px;text-shadow:0 2px 0 #6a4a2a,2px 0 0 #6a4a2a,-2px 0 0 #6a4a2a,0 -2px 0 #6a4a2a;}
.cv-logo h1{margin:4px 0 0;font-size:clamp(44px,11vw,88px);line-height:1.1;font-weight:900;color:#fffaeb;letter-spacing:4px;
 text-shadow:0 7px 0 #c9822a,4px 4px 0 #6a4a2a,-4px 4px 0 #6a4a2a,4px -4px 0 #6a4a2a,-4px -4px 0 #6a4a2a,0 5px 0 #6a4a2a,5px 0 0 #6a4a2a,-5px 0 0 #6a4a2a,0 -5px 0 #6a4a2a;}
.cv-go{border:none;border-radius:999px;padding:14px 46px;background:#f4a53c;color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 #c9822a;animation:cvPulse 1.6s ease-in-out infinite;}
.cv-go:active{transform:translateY(3px);box-shadow:0 2px 0 #c9822a;}
.cv-hint{margin-top:10px;font-size:13px;color:#6a4a2a;text-align:center;}
@keyframes cvIn{from{opacity:0;transform:translateY(-20px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes cvFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes cvPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
/* 揀地形 */
#terr{position:absolute;inset:0;display:none;z-index:12;pointer-events:none;}
#terr.on{display:block;}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px;}
.tc{border:none;background:#fff;border-radius:14px;padding:8px 2px 6px;color:#5a4632;font-size:13px;line-height:1.3;box-shadow:0 2px 0 rgba(90,70,50,.1);}
.tc b{display:block;font-size:26px;line-height:1.2;font-weight:400;}
.tc.on{background:#fff4cf;box-shadow:inset 0 0 0 3px #f4c542;}
.ti{background:#fff;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.7;}
.ti small{display:block;color:#8a7560;font-size:13px;}
@media (max-width:700px) and (orientation:portrait){#cover{justify-content:space-around;}}

@media (max-width:700px) and (orientation:portrait){.mk{left:12px;right:12px;width:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:none;max-height:56%;}}
@media (max-width:600px){#hint{display:none;}#rstat{margin-top:34px;font-size:12px;}#toasts{top:calc(128px + env(safe-area-inset-top));}.pill{font-size:13px;padding:4px 11px;}#joy{width:100px;height:100px;}#knob{left:26px;top:26px;}#abtn{width:78px;height:78px;}.btns{max-width:58%;}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hudL"><div class="row"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill" id="where">星球廣場</div></div><div class="pill" id="rstat"></div></div>
<div id="hudR"><div class="pill" id="clock">&nbsp;</div><div class="row"><button class="pill" id="bcam">🎥 標準</button><button class="pill" id="bday" aria-label="切換日夜">🌙</button><button class="pill" id="bphone">📱 手機<i id="badge"></i></button></div></div>
<div id="toasts"></div>
<div id="hint">方向鍵／WASD 或左下搖桿移動　空白鍵或 A 按鈕互動　C 切換鏡頭</div>
<div id="joy"><div id="knob"></div></div>
<button id="abtn"><b>A</b><span id="alab">—</span></button>
<div id="dlg"><div id="dlgO"></div><div id="dlgN"></div><div id="dlgB"><span id="dlgT"></span><span id="dlgA"></span></div></div>
<div id="panel"><div class="ph"><div><h2 id="pTitle"></h2><div class="sub" id="pSub"></div></div><button class="x" id="pClose" aria-label="關閉">✕</button></div><div class="tabs" id="pTabs"></div><div class="pb" id="pBody"></div></div>
<div id="make"><div class="mk"><h2 id="mkTitle">建立你的角色</h2><div class="sub" id="mkSub">先決定名字和樣子。之後可以到服務中心找綿綿改變造型。</div><label for="mkName">名字（最多 8 個字）</label><input id="mkName" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><div class="mkerr" id="mkErr"></div><label>膚色</label><div class="sws" id="mkSkin"></div><label>髮色</label><div class="sws" id="mkHair"></div><label>髮型</label><div class="chips" id="mkHs"></div><label>眼睛</label><div class="chips" id="mkEye"></div><button class="mkgo" id="mkGo">完成</button><button class="mkno" id="mkNo">取消</button></div></div>
<div id="terr"><div class="mk"><h2>選擇你的星球地形</h2><div class="sub">每個新星球只可以揀一次地形。點選看看，後面會即時顯示。</div><div class="tg" id="trGrid"></div><div class="ti" id="trInfo"></div><button class="mkgo" id="trGo">就選這個地形</button></div></div>
<div id="cover"><div class="cv-logo"><div class="cv-planet"></div><div class="cv-sub">旅遊與款待・經營遊戲</div><h1>真．旅遊星球</h1></div><div><button class="cv-go" id="cvGo">開始遊戲</button><div class="cv-hint" id="cvHint">&nbsp;</div></div></div>
<div id="fade"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
function fatal(m){document.body.innerHTML='<p style="padding:3rem 1.5rem;text-align:center;font:16px/1.7 sans-serif;color:#5a4632">'+m+'</p>';}
if(!window.THREE){fatal('未能載入 3D 程式庫，請檢查網絡後重新整理。');return;}
var T=THREE;

// ================= 設定 =================
// ⚠ 示範用「快速時間」：一格農田由播種到成熟大約 2 分鐘，方便即場試玩。
//   正式俾學生玩，可以將 stageSec／wetSec 調大（例如以小時計），做成動森咁每日返嚟打理。
var CFG={stageSec:40,wetSec:70,remindSec:30,patience:45,eatSec:12,baseInterval:14,marketSec:120,yield:2,saveKey:'ths-new-planet-v1',
 pondCap:8,fishGrowSec:90,breedSec:120,jobSec:150,researchFee:80,refreshFee:30};

// ================= 資料 =================
var CROPS={tomato:{n:'番茄',seed:12,sell:26},lettuce:{n:'生菜',seed:8,sell:18},carrot:{n:'甘筍',seed:10,sell:22},potato:{n:'薯仔',seed:14,sell:30}};
var GOODS={egg:{n:'雞蛋',p:14},milk:{n:'牛奶',p:16},rice:{n:'白米',p:12},fish:{n:'鮮魚',p:28},pineapple:{n:'菠蘿',p:24}};
var ICON={tomato:'🍅',lettuce:'🥬',carrot:'🥕',potato:'🥔',egg:'🥚',milk:'🥛',rice:'🍚',fish:'🐟',pineapple:'🍍'};
function iname(k){return (CROPS[k]||GOODS[k]).n;}
// 食材等級（研發新菜用）：g＝等級、v＝價值。等級越低，做出嚟嘅菜越平。
var ING={lettuce:{g:1,v:10},carrot:{g:1,v:11},tomato:{g:1,v:13},potato:{g:1,v:15},rice:{g:2,v:16},egg:{g:2,v:18},milk:{g:2,v:20},pineapple:{g:3,v:28},fish:{g:3,v:32}};
var ING_ORDER=['lettuce','carrot','tomato','potato','rice','egg','milk','pineapple','fish'],GRADE_N=['','一級','二級','三級'];
function sortKs(ks){return ks.slice().sort(function(a,b){return ING_ORDER.indexOf(a)-ING_ORDER.indexOf(b);});}
function dishPrice(ks){var s=0;ks.forEach(function(k){s+=ING[k].v;});return Math.round(s*2.5+15*ks.length);}
function dishStyle(ks){var has=function(k){return ks.indexOf(k)>=0;};
 if(ks.length===1&&ks[0]==='potato')return {ic:'🍟',col:0xf2cf55};
 if(has('rice'))return {ic:'🍛',col:0xf2c14e};if(has('fish'))return {ic:'🍲',col:0xe9885a,bowl:1};if(has('milk'))return {ic:'🧀',col:0xf5deb3};
 if(has('egg'))return {ic:'🍳',col:0xf06a3c};if(has('lettuce'))return {ic:'🥗',col:0x8fd46f};return {ic:'🥣',col:0xf59a3c,bowl:1};}
// 菜名由食材自動砌：有米＝炒飯、有魚＝魚湯、有奶＝忌廉焗、有蛋＝炒蛋、有生菜＝沙律，其餘＝湯
function dishName(ks){var has=function(k){return ks.indexOf(k)>=0;},base=sortKs(ks).filter(function(k){return ['rice','egg','milk','fish'].indexOf(k)<0;}).map(function(k){return (CROPS[k]||GOODS[k]).n;}).join('');
 if(has('rice'))return base+(has('egg')?'蛋':'')+(has('fish')?'魚片':'')+(has('milk')?'忌廉':'')+'炒飯';
 if(has('fish'))return (has('milk')?'忌廉':'')+base+(has('egg')?'蛋花':'')+'魚湯';
 if(has('milk'))return '忌廉焗'+base+(has('egg')?'蛋':'');
 if(has('egg'))return base+'炒蛋';
 if(has('lettuce'))return base+'沙律';
 return base+'湯';}
function makeRecipe(ks,nm){ks=sortKs(ks);var st=dishStyle(ks);return {id:ks.join('+'),n:nm||dishName(ks),ks:ks,ic:st.ic,col:st.col,bowl:st.bowl||0,price:dishPrice(ks)};}
// 開局識煮嘅三款
function starterRecipes(){return [makeRecipe(['lettuce','tomato'],'田園沙律'),makeRecipe(['carrot'],'甘筍湯'),makeRecipe(['potato'],'香脆薯條')];}
var CHEF_NAMES=['阿明','小芬','大強','美玲','阿傑','小橙','子晴','志偉','家欣','俊軒','詠詩','浩然','嘉儀','偉倫'];
// 廚師能力值：ck＝廚藝（味道）、sp＝手速；聘請費跟能力（廚藝貴得快）
function chefFee(ck,sp){return Math.round((ck*ck/8+sp*4+60)/10)*10;}
function newCandidate(used){var nm=shuf(CHEF_NAMES.filter(function(n){return used.indexOf(n)<0;}))[0]||'新廚師',ck=Math.round(15+80*Math.pow(Math.random(),1.5)),sp=Math.round(20+75*Math.random());return {nm:nm,ck:ck,sp:sp,h:Math.floor(Math.random()*6),fee:chefFee(ck,sp)};}
// 魚嘅大細（池塘養大）：m＝價錢倍數、por＝變成幾份「鮮魚」

// 每格 {k,n}：k＝'seed:番茄種'／'ing:農作物'／'fish:魚種|大細'。種子、農作物每格疊 10 個；魚每條佔一格
function stackLim(k){return k.indexOf('fish:')===0?1:10;}
function bagFree(){return S.bag.cap-S.bag.s.length;}
function bagCount(k){var n=0;S.bag.s.forEach(function(x){if(x.k===k)n+=x.n;});return n;}
function bagRoom(k){var L=stackLim(k),r=bagFree()*L;S.bag.s.forEach(function(x){if(x.k===k)r+=L-x.n;});return r;}
function bagAdd(k,n){if(bagRoom(k)<n)return false;var L=stackLim(k);S.bag.s.forEach(function(x){if(x.k===k&&n>0){var a=Math.min(n,L-x.n);x.n+=a;n-=a;}});while(n>0){var a=Math.min(n,L);S.bag.s.push({k:k,n:a});n-=a;}return true;}
function bagTake(k,n){if(!n||bagCount(k)<n)return false;for(var i=S.bag.s.length-1;i>=0&&n>0;i--){var x=S.bag.s[i];if(x.k!==k)continue;var a=Math.min(n,x.n);x.n-=a;n-=a;if(!x.n)S.bag.s.splice(i,1);}return true;}
function bagKeys(pre){var L=[];S.bag.s.forEach(function(x){if(x.k.indexOf(pre)===0&&L.indexOf(x.k)<0)L.push(x.k);});return L;}
function bagFullMsg(){toast('🎒 背包滿了（'+S.bag.s.length+' / '+S.bag.cap+' 格）：先把東西賣掉、放入池塘，或者交到餐廳',4200);}
function bagLine(){return '背包 '+S.bag.s.length+' / '+S.bag.cap+' 格';}
function seen(k){S.seen[k]=1;}
function slotInfo(x){var a=x.k.split(':'),k=a[1];
 if(a[0]==='seed')return {ic:ICON[k],nm:iname(k)+'種子',n:x.n};
 if(a[0]==='ing')return {ic:ICON[k],nm:iname(k),n:x.n};
 var p=parseKey(k);return {ic:FISH_EMO[p.k]||'🐟',nm:p.f.n,n:p.cl.n};}

var WATER=null,canHinted=false,sprays=[],gSpray=new T.SphereGeometry(0.045,6,5),sprayM=M(0x7fd0ff);

function waterTargets(i,n){var rows=Math.ceil(S.plots.length/3),c=i%3,r=Math.floor(i/3),sh=n>=9?[3,3]:n>=6?[3,2]:n>=4?[2,2]:n>=3?[3,1]:n>=2?[2,1]:[1,1],w=sh[0],h=Math.min(sh[1],rows);
 var gx=(P.x-6.4)/1.6,gz=(P.z-2.2)/1.6,best=[c,r],bd=1e9;
 for(var c0=Math.max(0,c-w+1);c0<=Math.min(c,3-w);c0++)for(var r0=Math.max(0,r-h+1);r0<=Math.min(r,rows-h);r0++){var d=Math.hypot(c0+(w-1)/2-gx,r0+(h-1)/2-gz);if(d<bd){bd=d;best=[c0,r0];}}
 var L=[];for(var y=0;y<h;y++)for(var x=0;x<w;x++){var j=(best[1]+y)*3+best[0]+x;if(j<S.plots.length)L.push(j);}return L;}

function hiredChefs(){return S.chefs.slice(0,chefSlots()).filter(Boolean);}
function hasIng(r){for(var i=0;i<r.ks.length;i++)if((S.inv[r.ks[i]]||0)<1)return false;return true;}
function needsFridge(r){return r.ks.some(function(k){return CHILL[k];});}
function dishLock(r){if(!hiredChefs().length)return 'chef';if(needsFridge(r)&&!S.up.fridge)return 'fridge';return '';}
function availDishes(){return S.recipes.filter(function(r){return !dishLock(r)&&hasIng(r);});}
function chilledCount(){var n=0;for(var k in CHILL)n+=S.inv[k]||0;return n;}
function avgCk(){var h=hiredChefs();if(!h.length)return 0;var s=0;h.forEach(function(c){s+=c.ck;});return s/h.length;}
function tasteStars(){var a=avgCk();return a?Math.min(5,1+a/25):0;}
function cookSec(c){return 9*(1.4-c.sp/100*0.8)*UP.stove.L[S.up.stove].sp;}
function payMult(ck){return 0.8+ck/100*0.8;}
// 吸引力＝美觀、款式、味道三項平均；越高遊客越密
function starInfo(){var d=S.deco.cur,bp=0;['floor','wall','table','chair'].forEach(function(k){bp+=decoItem(k,d[k]).b;});
 var beauty=Math.min(5,1+(bp-4)/3),av=availDishes(),n=av.length,variety=[0,1,2,3,3.5,4,4.5,5,5,5][Math.min(n,9)],taste=tasteStars(),pop=(beauty+variety+taste)/3;
 return {beauty:beauty,variety:variety,n:n,taste:taste,pop:pop,av:av,interval:n?CFG.baseInterval/(0.4+0.3*pop):0};}
var seatUsed=SEATS.map(function(){return false;}),walkers=[],cust=[],queue=[],floaters=[],spawnT=CFG.baseInterval-4;
// 遊客路線：飛碟站（光柱）→ 廣場西邊 → 旅款餐廳門口；離開時倒轉，行返飛碟升返上去
var TOUR=[[0,16],[0,6.2],[-2.3,4.6],[-2.3,-1.6],[-7,-1.6],[-7,-2.4]];
function animWalk(m,ph,mv){var u=m.userData,sn=Math.sin(ph);
 if(mv){u.b.position.y=Math.abs(sn)*0.03;if(u.legs){u.lg[0].rotation.x=sn*0.6;u.lg[1].rotation.x=-sn*0.6;u.am[0].rotation.x=-sn*0.5;u.am[1].rotation.x=sn*0.5;}}
 else{u.b.position.y=0;if(u.legs){u.lg[0].rotation.x*=0.8;u.lg[1].rotation.x*=0.8;u.am[0].rotation.x*=0.8;u.am[1].rotation.x*=0.8;}}}
function newWalker(L,dir,seat){var path=dir===1?TOUR:TOUR.slice().reverse(),m=noCull(lookModel(L));scO.add(m);
 var w={m:m,L:L,path:path,pi:1,x:path[0][0],z:path[0][1],seat:seat,dir:dir,sh:shadow(scO,path[0][0],path[0][1],0.5),ph:Math.random()*6,st:dir===1?'down':'walk',t:0,s0:m.scale.x};
 if(dir===1){m.position.set(w.x,2.4,w.z);m.scale.setScalar(w.s0*0.3);}walkers.push(w);}
function spawnTourist(){var f=[];seatUsed.forEach(function(u,i){if(!u)f.push(i);});if(!f.length)return;var si=pick(f);seatUsed[si]=true;newWalker(randLook(),1,si);}
function dropWalker(i){var w=walkers[i];scO.remove(w.m);scO.remove(w.sh);disposeTree(w.m);walkers.splice(i,1);}
function updWalkers(dt){var beaming=false;for(var i=walkers.length-1;i>=0;i--){var w=walkers[i];
 if(w.st==='down'||w.st==='up'){w.t+=dt;var k=Math.min(1,w.t/1.4),f=w.st==='down'?k:1-k;w.m.position.set(w.x,2.4*(1-f),w.z);w.m.scale.setScalar(w.s0*(0.3+0.7*f));w.m.rotation.y+=dt*6;beaming=true;
  if(k>=1){if(w.st==='down'){w.st='walk';w.m.rotation.y=Math.PI;}else{dropWalker(i);}}continue;}
 if(w.st==='talk'){w.m.rotation.y=lerpA(w.m.rotation.y,Math.atan2(P.x-w.x,P.z-w.z),dt*8);animWalk(w.m,0,false);continue;}
 var tg=w.path[w.pi],dx=tg[0]-w.x,dz=tg[1]-w.z,d=Math.hypot(dx,dz),sp=2.4*dt;
 if(d<=sp){w.x=tg[0];w.z=tg[1];w.pi++;if(w.pi>=w.path.length){if(w.dir===1){var L=w.L,se=w.seat;dropWalker(i);enterCustomer(L,se);}else{w.st='up';w.t=0;}continue;}}
 else{w.x+=dx/d*sp;w.z+=dz/d*sp;w.m.rotation.y=Math.atan2(dx,dz);}
 w.m.position.set(w.x,0,w.z);w.sh.position.set(w.x,0.03,w.z);w.ph+=dt*10;animWalk(w.m,w.ph,true);}
 beam.visible=beaming;if(beaming)beam.material.opacity=0.25+Math.sin(tm*12)*0.08;}
function enterCustomer(L,si){var m=noCull(lookModel(L));scI.add(m);var s=SEATS[si];
 cust.push({m:m,L:L,seat:si,path:[[0,4.9],[0,3.9],[s.cx,3.9],[s.cx,s.z],[s.x,s.z]],pi:1,x:0,z:4.9,st:'in',t:0,dish:null,bub:null,plate:null,ph:0,ck:30,angry:false});}
function setBub(c,txt,bg){killSprite(c.bub);c.bub=null;if(txt){c.bub=bubble(txt,bg||'#fffaeb','#5a4632',0.42);scI.add(c.bub);}}
function sitDown(c){var s=SEATS[c.seat],u=c.m.userData;c.x=s.x;c.z=s.z;c.m.rotation.y=s.f;c.m.position.set(s.x,u.legs?0.24:0.32,s.z);if(u.legs){u.lg[0].rotation.x=u.lg[1].rotation.x=-1.35;u.am[0].rotation.x=u.am[1].rotation.x=0;}u.b.position.y=0;
 var av=availDishes();if(!av.length){angry(c);return;}c.dish=pick(av);c.st='order';c.t=0;setBub(c,c.dish.ic+' '+c.dish.n);queue.push(c);}
function angry(c){setBub(c,'💢','#ffe1dc');c.angry=true;S.st.angry++;standUp(c);}
function standUp(c){var s=SEATS[c.seat],u=c.m.userData;seatUsed[c.seat]=false;c.st='out';c.path=[[s.x,s.z],[s.cx,s.z],[s.cx,3.9],[0,3.9],[0,4.9]];c.pi=1;c.x=s.x;c.z=s.z;c.m.position.y=0;if(u.legs){u.lg[0].rotation.x=u.lg[1].rotation.x=0;}c.t=0;}
function serve(c,ck){c.st='eat';c.t=0;c.ck=ck;var s=SEATS[c.seat];c.plate=noCull(foodModel(c.dish));c.plate.position.set(s.x+(s.f>0?0.5:-0.5),0.8,s.z);scI.add(c.plate);setBub(c,'😋');}
function pay(c){var amt=Math.round(c.dish.price*payMult(c.ck));S.coins+=amt;S.st.served++;S.st.earned+=amt;coinsUI();if(where==='out')hudPlus(amt);
 if(c.plate){scI.remove(c.plate);disposeTree(c.plate);c.plate=null;}setBub(c,null);floatText('+$'+amt,c.x,1.9,c.z);standUp(c);save();}
function floatText(txt,x,y,z){var s=bubble(txt,'#fff4cf','#8a5a00',0.42);s.position.set(x,y,z);scI.add(s);floaters.push({s:s,t:0,y:y});}
function updCust(dt){for(var i=cust.length-1;i>=0;i--){var c=cust[i];
 if(c.st==='in'||c.st==='out'){var tg=c.path[c.pi],dx=tg[0]-c.x,dz=tg[1]-c.z,d=Math.hypot(dx,dz),sp=1.9*dt,gone=false;
  if(d<=sp){c.x=tg[0];c.z=tg[1];c.pi++;if(c.pi>=c.path.length){if(c.st==='in')sitDown(c);else{setBub(c,null);scI.remove(c.m);disposeTree(c.m);cust.splice(i,1);newWalker(c.L,-1,-1);gone=true;}}}
  else{c.x+=dx/d*sp;c.z+=dz/d*sp;c.m.rotation.y=Math.atan2(dx,dz);}
  if(gone)continue;
  if(c.st==='in'||c.st==='out'){c.m.position.set(c.x,0,c.z);c.ph+=dt*10;animWalk(c.m,c.ph,true);}}
 else if(c.st==='order'){c.t+=dt;if(c.t>CFG.patience){var qi=queue.indexOf(c);if(qi>=0)queue.splice(qi,1);angry(c);}}
 else if(c.st==='eat'){c.t+=dt;if(c.t>=CFG.eatSec)pay(c);}
 if(c.bub)c.bub.position.set(c.x,c.m.position.y+(c.m.userData.bh||1.4),c.z);}
 for(var f=floaters.length-1;f>=0;f--){var o=floaters[f];o.t+=dt;o.s.position.y=o.y+o.t*0.6;o.s.material.opacity=Math.max(0,1-o.t/1.4);if(o.t>1.4){killSprite(o.s);floaters.splice(f,1);}}}
function updKitchen(dt,t){var slots=chefSlots();
 for(var q=0;q<queue.length;q++){var c=queue[q];if(c.st!=='order')continue;
  if(!hasIng(c.dish)||dishLock(c.dish)){var av=availDishes();if(!av.length)continue;c.dish=pick(av);setBub(c,c.dish.ic+' '+c.dish.n);}
  var best=-1,bc=-1;for(var k=0;k<slots;k++){var ch=chefRT[k],d=S.chefs[k];if(ch&&d&&!ch.busy&&d.ck>bc){best=k;bc=d.ck;}}
  if(best>=0){c.dish.ks.forEach(function(ik){S.inv[ik]-=1;});chefRT[best].busy={c:c,t:0,dur:cookSec(S.chefs[best])};c.st='cook';setBub(c,'⏳ '+c.dish.n);}}
 queue=queue.filter(function(c){return c.st==='order';});
 chefRT.forEach(function(ch,k){if(!ch)return;var u=ch.m.userData,target=ch.busy?Math.PI:0;ch.rot+=(target-ch.rot)*Math.min(1,dt*8);ch.m.rotation.y=ch.rot;
  if(ch.busy){ch.busy.t+=dt;ch.bar.visible=true;setBar(ch.bar,ch.busy.t/ch.busy.dur);u.am[0].rotation.x=Math.sin(t*10)*0.6-0.4;u.am[1].rotation.x=Math.sin(t*10+1.5)*0.6-0.4;
   ch.steam.forEach(function(p,j){p.visible=true;var ph=(t*0.8+j/3)%1;p.position.y=1.3+ph*0.9;p.scale.setScalar(0.6+ph);});
   if(ch.busy.t>=ch.busy.dur){var c=ch.busy.c;ch.busy=null;if(c.st==='cook')serve(c,S.chefs[k]?S.chefs[k].ck:30);}}
  else{ch.bar.visible=false;u.am[0].rotation.x*=0.8;u.am[1].rotation.x*=0.8;ch.steam.forEach(function(p){p.visible=false;});u.b.position.y=Math.abs(Math.sin(t*2+k))*0.01;}});}
// 解僱煮緊嘢嘅廚師：張單退返去排隊，食材還返
function releaseChef(k){var rt=chefRT[k];if(rt&&rt.busy){var c=rt.busy.c;rt.busy=null;if(c.st==='cook'){c.dish.ks.forEach(function(ik){S.inv[ik]+=1;});c.st='order';c.t=0;setBub(c,c.dish.ic+' '+c.dish.n);queue.push(c);}}}
function spawnTick(dt){var si=starInfo();if(!si.n){spawnT=0;return;}spawnT+=dt;if(spawnT>=si.interval){spawnT=0;spawnTourist();}}
// 同遊客傾偈：行緊路嘅（室外）、餐廳入面嘅（室內）
function leaveLine(){var si=starInfo(),L=[];
 if(si.taste>=4)L.push('廚師的手藝真好，每道菜都很好吃！');if(si.taste&&si.taste<2.5)L.push('味道普通，希望廚師再進步。');
 if(si.beauty>=4)L.push('餐廳裝修很漂亮，我拍了很多照片！');if(si.beauty<2)L.push('餐廳可以再漂亮一點。');
 if(si.variety>=4)L.push('菜式很多，下次要再來試其他菜！');if(si.variety<2)L.push('菜式選擇不多，下次想試新菜。');
 L.push('吃得好飽！我要回家了。');return pick(L);}
function walkerTalk(w){w.st='talk';var L=w.L,lines=['你好！我是'+L.pl+'的'+L.nm+'。'];
 lines.push(w.dir===1?pick(['聽說這裏的旅款餐廳很有名，我專程來試試！','坐了很久飛碟，肚子好餓啊。','這個星球的空氣好清新！','你就是'+me()+'嗎？我第一次來這個星球，好興奮！']):leaveLine());
 talk(L.nm+'（'+L.pl+'旅客）','#8fd66b','#24410f',lines,null,function(){if(w.st==='talk')w.st='walk';});}
function custTalk(c){var d=c.dish?c.dish.n:'',t;
 if(c.st==='in')t=pick(['這間餐廳人氣真旺！','今天吃甚麼好呢？']);
 else if(c.st==='order')t='我點了'+d+'，好期待！';else if(c.st==='cook')t='廚房好香啊，'+d+'快好了嗎？';
 else if(c.st==='eat')t=c.ck>=60?d+'真好味！':d+'還可以。';else t=c.angry?'等太久了，下次再算。':'謝謝款待，下次再來！';
 talk(c.L.nm+'（'+c.L.pl+'旅客）','#8fd66b','#24410f',[t]);}
// 食材交收：背包嘅農作物交俾廚房倉庫；魚可以處理成鮮魚（要雪櫃）
function deposit(bk,n){var k=bk.slice(4);if(!bagTake(bk,n))return;S.inv[k]=(S.inv[k]||0)+n;toast('📦 '+ICON[k]+' '+iname(k)+' ×'+n+' 交給了廚房');save();renderPanel();}
function depositAll(){var n=0;bagKeys('ing:').forEach(function(bk){var k=bk.slice(4),c=bagCount(bk);if(bagTake(bk,c)){S.inv[k]=(S.inv[k]||0)+c;n+=c;}});if(n){toast('📦 把 '+n+' 件農作物交給了廚房');save();}renderPanel();}
function fishToIng(fk){var por=parseKey(fk).cl.por,cap=UP.fridge.L[S.up.fridge].cap;
 if(!S.up.fridge){toast('🧊 要有雪櫃，才可以把魚處理成鮮魚');return;}
 if(chilledCount()+por>cap){toast('🧊 雪櫃位置不夠（需要 '+por+' 格）');return;}
 if(!bagTake('fish:'+fk,1))return;S.inv.fish=(S.inv.fish||0)+por;seen('fish');toast('🐟 '+fishLab(fk)+'處理成 '+por+' 份鮮魚，放進了雪櫃');save();renderPanel();}
var storeHinted=false;

// ================= 市場 =================
function restock(){var L=[];SELLERS.forEach(function(s){shuf(s.it.slice()).slice(0,Math.min(2,s.it.length)).forEach(function(k){var base=GOODS[k]?GOODS[k].p:Math.round(CROPS[k].sell*1.25);L.push({k:k,w:s.w,q:2+Math.floor(Math.random()*5),p:Math.max(1,Math.round(base*(0.85+Math.random()*0.4)))});});});S.mk.list=L;S.mk.next=Date.now()+CFG.marketSec*1000;}
function mmss(s){return Math.floor(s/60)+' 分 '+(s%60)+' 秒';}
// ⚠ 倒數只改一粒字，唔好每秒成個面板重畫——重畫會令啱啱撳落去嘅掣消失，click 就唔會觸發
var mkT=0;function marketTick(dt){mkT+=dt;if(mkT<1)return;mkT=0;
 if(Date.now()>=S.mk.next){restock();toast('🛒 星際市場補貨了');save();if(panelKind==='market')renderPanel();}
 else if(panelKind==='market'&&panelTab==='trade'){var e=$('mkcd');if(e)e.textContent=mmss(Math.max(0,Math.ceil((S.mk.next-Date.now())/1000)));}
 if(Date.now()>=S.jobs.next||!S.jobs.list.length){refreshJobs();if(panelKind==='staff')renderPanel();}
 else if(panelKind==='staff'&&panelTab==='hire'){var e2=$('jbcd');if(e2)e2.textContent=mmss(Math.max(0,Math.ceil((S.jobs.next-Date.now())/1000)));}
 pondTick();}
function buy(cost,fn){if(S.coins<cost){toast('金幣不足');return;}S.coins-=cost;fn();coinsUI();save();renderPanel();}
function buySeed(k,n){if(bagRoom('seed:'+k)<n){bagFullMsg();return;}buy(CROPS[k].seed*n,function(){bagAdd('seed:'+k,n);toast('🌱 '+iname(k)+'種子 ×'+n+' 放進了背包');});}
function sellCrop(bk,n){if(!n||!bagTake(bk,n))return;var k=bk.slice(4),amt=n*CROPS[k].sell;S.coins+=amt;coinsUI();toast('🪙 賣出'+iname(k)+' ×'+n+'，+$'+amt);save();renderPanel();}
// 漁獲：key＝魚種|大細（例如 bream|L）
function parseKey(key){var a=key.split('|');return {f:fishOf(a[0]),cl:clsOf(a[1]||'S'),k:a[0],c:a[1]||'S'};}
function fishPrice(key){var p=parseKey(key);return Math.round(p.f.p*p.cl.m);}
function fishLab(key){var p=parseKey(key);return p.f.n+'（'+p.cl.n+'）';}
function sellFish(fk,n){if(!n||!bagTake('fish:'+fk,n))return;var amt=n*fishPrice(fk);S.coins+=amt;coinsUI();toast('🪙 賣出'+fishLab(fk)+' ×'+n+'，+$'+amt);save();renderPanel();}
var npcHop={fu:0,tutu:0,gulo:0,pengu:0,mian:0};
function marketTalk(){var first=!S.met.fu;S.met.fu=1;save();npcHop.fu=0.8;
 talk('阿福（市場老闆）','#5dbb73','#ffffff',first?['歡迎光臨星際市場，'+me()+'！我是老闆阿福。','種子會放進你的背包；其他星球的食材，我會直接送到你的旅款餐廳。','背包裏的農作物和漁獲，也可以賣給我。今天想做甚麼？']:['你好，'+me()+'！今天想做甚麼？'],
  [{t:'買種子',cb:function(){openPanel('market','seed');}},{t:'出售農作物和漁獲',cb:function(){openPanel('market','sell');}},{t:'其他星球貨品',cb:function(){openPanel('market','trade');}},{t:'沒事了',cb:function(){}}]);}

// ================= 池塘（養魚）=================
// 魚照真實時間長大：每 fishGrowSec 秒升一級（小→中→大→巨）；同種有兩條中型以上，每 breedSec 秒有機會生小魚
function fIdx(f,now){return Math.min(3,Math.floor(((now||Date.now())-f.born)/1000/CFG.fishGrowSec));}
function pondTick(){var P0=S.pond,now=Date.now(),n=0;while(now-P0.lastBreed>=CFG.breedSec*1000&&n<6){P0.lastBreed+=CFG.breedSec*1000;n++;breedOnce(P0.lastBreed);}if(n>=6)P0.lastBreed=now;}
function breedOnce(ts){if(S.pond.fish.length>=CFG.pondCap)return;var cnt={};S.pond.fish.forEach(function(f){if(fIdx(f,ts)>=1)cnt[f.k]=(cnt[f.k]||0)+1;});
 var sp=Object.keys(cnt).filter(function(k){return cnt[k]>=2;});if(!sp.length||Math.random()>0.6)return;var k=pick(sp);S.pond.fish.push({k:k,born:ts,id:Math.random().toString(36).slice(2,8)});toast('🐟 池塘多了一條小'+fishOf(k).n+'！');save();if(panelKind==='pond')renderPanel();}
function releaseFish(fk){if(S.pond.fish.length>=CFG.pondCap){toast('池塘已經滿了（最多 '+CFG.pondCap+' 條）');return;}if(!bagTake('fish:'+fk,1))return;var p=parseKey(fk),idx=FCLS.indexOf(p.cl);
 S.pond.fish.push({k:p.k,born:Date.now()-idx*CFG.fishGrowSec*1000,id:Math.random().toString(36).slice(2,8)});toast('🐟 放了'+fishLab(fk)+'入池塘');save();renderPanel();}
function netFish(id){if(bagFree()<1){bagFullMsg();return;}var i=S.pond.fish.findIndex(function(f){return f.id===id;});if(i<0)return;var f=S.pond.fish[i],key=f.k+'|'+FCLS[fIdx(f)].c;S.pond.fish.splice(i,1);bagAdd('fish:'+key,1);toast('🥅 撈起了'+fishLab(key)+'，值 $'+fishPrice(key)+'，放進了背包');save();renderPanel();}
function pondTalk(){var first=!S.met.pond;S.met.pond=1;save();
 talk('池塘','#3f8fb0','#ffffff',(first?['池塘可以養魚：魚會慢慢長大，由「小」一直長到「巨」。','同一種魚有兩條或以上長到「中」，就有機會生小魚。長大了才撈上來賣，價錢會高很多。']:[])
  .concat(['池塘現在有 '+S.pond.fish.length+' / '+CFG.pondCap+' 條魚。要做甚麼？']),
  [{t:'看看池塘的魚',cb:function(){openPanel('pond','pond');}},{t:'放魚入池塘',cb:function(){openPanel('pond','put');}},{t:'沒事了',cb:function(){}}]);}

  if(d<0.06){n.wait=1.5+Math.random()*3;var a=Math.random()*6.283,rr=Math.random()*n.r,tx=n.hx+Math.cos(a)*rr,tz=n.hz+Math.sin(a)*rr;if(!ccBlocked(n,tx,tz)){n.tx=tx;n.tz=tz;}}
  else{var st=Math.min(d,0.75*dt),nx=n.x+dx/d*st,nz=n.z+dz/d*st;if(!ccBlocked(n,nx,nz)){n.x=nx;n.z=nz;n.face=Math.atan2(dx,dz);mv=true;}else{n.tx=n.x;n.tz=n.z;}}}
 n.rot=lerpA(n.rot,n.face,dt*6);n.m.position.set(n.x,0,n.z);n.m.rotation.y=n.rot;
 var b=n.m.userData.b,h=npcHop[n.k]||0;if(h>0)npcHop[n.k]=h-dt;
 if(mv){n.ph+=dt*9;b.position.y=Math.abs(Math.sin(n.ph))*0.025;b.rotation.z=Math.sin(n.ph)*0.07;}else{b.rotation.z*=0.85;b.position.y=(h>0?Math.abs(Math.sin(t*12))*0.05:0)+Math.abs(Math.sin(t*1.8+i))*0.01;}});}
function fadeTick(dt){FADERS.forEach(function(F0){var near=false;if(where==='out'&&!making&&phase==='play'){_uc.copy(bendPt(F0.x,F0.y,F0.z));near=segDist(_uc,cam.position,P.x,1.1,P.z)<F0.r;}
 var tg=near?0.18:1;if(Math.abs(tg-F0.f)<0.002)return;F0.f+=(tg-F0.f)*Math.min(1,dt*7);F0.mats.forEach(function(m){m.opacity=F0.f;m.depthWrite=F0.f>0.95;});});}
function updNPCs(dt,t){[['fu',fu]].forEach(function(a,i){var h=npcHop[a[0]];if(h>0)npcHop[a[0]]=h-dt;a[1].userData.b.position.y=(h>0?Math.abs(Math.sin(t*12))*0.05:0)+Math.abs(Math.sin(t*1.8+i))*0.01;});}

// ================= 封面、揀地形 =================

var phase='cover',trSel='grass',orbA=0.6;

function startPlay(){phase='play';$('app').classList.remove('cover');cam.clearViewOffset();CU.uB.value=where==='out'?1:0;sea.scale.set(1,1,1);fx=P.x;fz=P.z;
 if(!S.me||!S.me.nm)openMaker(true);else if(!S.intro)setTimeout(intro,500);else toast('🌏 歡迎回到你的星球，'+me()+'！');}
function viewShift(box){var W=innerWidth,H=innerHeight,r=box.getBoundingClientRect(),ox=0,oy=0;if(r.left>W*0.3)ox=Math.round((W-r.left)/2);else oy=Math.round((H-r.top)/2);

function camOrbit(dt){orbA+=dt*0.06;var R=cam.aspect<1?64:48,y=cam.aspect<1?36:28;cam.position.set(Math.sin(orbA)*R,y,Math.cos(orbA)*R);cam.lookAt(0,0,0);CU.uCZ.value=0;stars.position.copy(cam.position);sky.position.copy(cam.position);
 if(phase==='terrain')viewShift(document.querySelector('#terr .mk'));else if(cam.view&&cam.view.enabled)cam.clearViewOffset();}
// 地形動畫：風車、煙／蒸氣、落雪；服務中心大鍋冒泡
var CAUL=null;scC.traverse(function(n){if(n.userData&&n.userData.bub)CAUL=n;});
function updTerr(dt,t){TFX.forEach(function(e){if(e.t==='spin'){e.o.rotation.z+=dt*0.9;return;}
  e.acc+=dt*e.rate;while(e.acc>=1){e.acc-=1;for(var i=0;i<e.list.length;i++){var p=e.list[i];if(p.t<0){p.t=0;p.ox=(Math.random()-0.5)*e.sz*2;p.oz=(Math.random()-0.5)*e.sz*2;break;}}}
  e.list.forEach(function(p){if(p.t<0)return;p.t+=dt;var k=p.t/2.4;if(k>=1){p.t=-1;p.m.visible=false;return;}p.m.visible=true;p.m.position.set(e.x+p.ox+Math.sin(p.t*2)*0.12,e.y+k*2.4,e.z+p.oz);p.m.scale.setScalar(e.sz*(0.5+k*1.3));p.m.material.opacity=0.55*(1-k)*Math.min(1,p.t*4);});});
 if(snowFx&&where==='out'){var a=snowFx.geometry.attributes.position,arr=a.array;for(var i=1;i<arr.length;i+=3){arr[i]-=dt*1.6;if(arr[i]<0)arr[i]+=16;}a.needsUpdate=true;snowFx.position.set(fx,0,fz);}
 if(CAUL&&where==='cc')CAUL.userData.bub.forEach(function(b,i){var k=(t*0.8+i*0.25)%1;b.position.y=0.66+k*0.3;b.scale.setScalar(0.6+k*0.8);b.visible=k<0.9;});}

// ================= 鏡頭、日夜、時鐘 =================
var MODES=[{n:'標準',o:[0,9,9.5],l:[0,0.8,0]},{n:'低角度',o:[0,2.6,7.2],l:[0,1.8,-5]},{n:'俯瞰',o:[0,17,3.5],l:[0,0,0]}],mode=0;
var cO=new T.Vector3(0,9,9.5),cL=new T.Vector3(0,0.8,0),fx=P.x,fz=P.z;
function camNext(){mode=(mode+1)%3;$('bcam').textContent='🎥 '+MODES[mode].n;}
// 角色設定時：鏡頭企喺角色正前面；用 setViewOffset 將角色推去設定框以外嘅空位（唔好郁低鏡頭，會穿入地底）
function camMirror(){var W=innerWidth,H=innerHeight,r=document.querySelector('#make .mk').getBoundingClientRect(),d=cam.aspect<1?5.6:4.9,ox=0,oy=0;
 if(r.left>W*0.3)ox=Math.round((W-r.left)/2);else oy=Math.round((H-r.top)/2);
 var v=cam.view;if(!v||!v.enabled||v.offsetX!==ox||v.offsetY!==oy||v.fullWidth!==W||v.fullHeight!==H)cam.setViewOffset(W,H,ox,oy,W,H);
 cam.position.set(P.x,1.15,P.z+d);cam.lookAt(P.x,0.72,P.z);CU.uCZ.value=P.z;sea.position.z=P.z;stars.position.copy(cam.position);sky.position.copy(cam.position);}
function camUpdate(dt){
 if(phase!=='play'){camOrbit(dt);return;}
 if(making){camMirror();return;}
 if(where==='out'){var m=MODES[mode],k=1-Math.exp(-dt*5),por=cam.aspect<1?1.3:1;
  cO.x+=(m.o[0]-cO.x)*k;cO.y+=(m.o[1]-cO.y)*k;cO.z+=(m.o[2]-cO.z)*k;cL.x+=(m.l[0]-cL.x)*k;cL.y+=(m.l[1]-cL.y)*k;cL.z+=(m.l[2]-cL.z)*k;
  var kf=1-Math.exp(-dt*8);fx+=(P.x-fx)*kf;fz+=(P.z-fz)*kf;
  cam.position.set(fx+cO.x,cO.y*por,fz+cO.z*por);cam.lookAt(fx+cL.x,cL.y,fz+cL.z);CU.uCZ.value=fz;sea.position.z=fz;stars.position.copy(cam.position);sky.position.copy(cam.position);}
 else if(where==='in'){var ax=cam.aspect<1?0.85:0.3,dist=cam.aspect<1?1.35:1;cam.position.set(P.x*ax,9.3*dist,4.6+6.6*dist);cam.lookAt(P.x*ax,0.3,-0.3);}
 else{var ax2=cam.aspect<1?0.8:0.3,dist2=cam.aspect<1?1.6:1;cam.position.set(P.x*ax2,8.0*dist2,3.2+6.4*dist2);cam.lookAt(P.x*ax2,0.3,-0.7);}}
var nt=0,nk=0,ovr=false;
var hD=new T.Color(0xffffff),hN=new T.Color(0x9aa6f0),gD=new T.Color(0x9d8fd6),gN=new T.Color(0x2e2b5c),wE=new T.Color(0xffc766),bE=new T.Color(0xffe39a),rE=new T.Color(0xff5fae),SKY=new T.Color(0xbde7ff),SKN=new T.Color(0x1d2142),skyC=new T.Color(),INB=new T.Color(0x3a2e25);
function dayNight(dt){nk+=((making||phase!=='play'?0:nt)-nk)*Math.min(1,dt*2.5);
 if(where==='out'||phase!=='play'){skyC.copy(SKY).lerp(SKN,nk);rd.setClearColor(skyC,1);}else rd.setClearColor(INB,1);
 hemiO.color.copy(hD).lerp(hN,nk);hemiO.groundColor.copy(gD).lerp(gN,nk);hemiO.intensity=0.62-0.08*nk;sunO.intensity=0.55-0.35*nk;
 winM.emissive.copy(wE).multiplyScalar(nk*0.9);bulbM.emissive.copy(bE).multiplyScalar(nk);GLOWC.forEach(function(g){g.c.emissive.copy(g.s.emissive);});ringM.emissive.copy(rE).multiplyScalar(nk*0.6);
 uL.forEach(function(lm,i){lm.emissive.copy(lm.color).multiplyScalar((0.25+0.25*Math.sin(tm*5+i*1.3))*(0.6+0.8*nk));});stars.material.opacity=nk;clM.opacity=1-nk*0.85;}
function clk(){var d=new Date(),h=d.getHours(),m=d.getMinutes();$('clock').textContent=(h<12?'上午 ':'下午 ')+(h%12||12)+':'+(m<10?'0':'')+m+'　'+(d.getMonth()+1)+'月'+d.getDate()+'日';if(!ovr)nt=(h>=19||h<6)?1:0;$('bday').textContent=nt?'☀️':'🌙';}

// ================= 輸入 =================
var K={},KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',W:'u',s:'d',S:'d',a:'l',A:'l',d:'r',D:'r'};
function act(){if(phase==='cover'){leaveCover();return;}if(fading||panelKind||making||phase!=='play')return;if(HOLD){if(HOLD.t<1.35)HOLD.t=1.35;return;}if(WATER){waterPress();return;}if(D0){adv();return;}if(F){fishPress();return;}if(cur)cur.fn();}
window.addEventListener('keydown',function(e){if(making||phase==='terrain')return;var k=e.key;if(phase==='cover'){if(k===' '||k==='Enter'){e.preventDefault();leaveCover();}return;}
 if(k==='Escape'){if(panelKind)closePanel();return;}
 if(panelKind)return;
 if(KM[k]){K[KM[k]]=true;e.preventDefault();return;}
 if(k===' '||k==='Enter'||k==='z'||k==='Z'){e.preventDefault();if(!e.repeat)act();return;}
 if(k==='c'||k==='C'){if(where==='out')camNext();return;}
 if(D0&&D0.opts&&D0.optsShown&&k>='1'&&k<='9'){var bs=$('dlgO').querySelectorAll('button'),b=bs[+k-1];if(b&&!b.disabled)b.click();}});
window.addEventListener('keyup',function(e){if(KM[e.key])K[KM[e.key]]=false;});
window.addEventListener('blur',function(){K={};});
var jv={x:0,y:0},jid=null,joy=$('joy'),knob=$('knob');
function jmove(e){var r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),L=Math.hypot(dx,dy),mx=r.width/2-12;if(L>mx){dx*=mx/L;dy*=mx/L;}knob.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/mx;jv.y=dy/mx;}
joy.addEventListener('pointerdown',function(e){jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}jmove(e);});
joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e);});

joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
['abtn','bcam','bday','bphone'].forEach(function(id){$(id).addEventListener('pointerdown',function(e){e.preventDefault();});});

// ================= 主迴圈 =================
var testFreeze=false,last=performance.now(),tm=0,ph=0,cur=null,saveT=0,moved=false,hintT=0,lastLab='',rsT=1;
function loop(now){var dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;tm+=dt;
 var busy=!!D0||!!panelKind||fading||making||!!HOLD||!!WATER||phase!=='play';
 var ix=(K.r?1:0)-(K.l?1:0)+jv.x,iz=(K.d?1:0)-(K.u?1:0)+jv.y,L=Math.hypot(ix,iz),mv=false;if(L>1){ix/=L;iz/=L;L=1;}
 if(!busy&&L>0.12){if(F)endFish();var sp=4.2*L*dt;tryMove(P,ix*sp,iz*sp,0.4,'p');P.face=Math.atan2(ix,iz);mv=true;if(!moved){moved=true;$('hint').style.opacity='0';}}
 hintT+=dt;if(hintT>12)$('hint').style.opacity='0';
 P.rot=lerpA(P.rot,P.face,dt*12);
 var onPad=where==='out'&&Math.hypot(P.x,P.z-16)<1.8?0.1:0,onPier=where==='out'&&P.x>18.4?0.07:0;

 growFarm();updPlots(dt,tm);if(!making)updBobo(dt);bobo.visible=bSh.visible=!making;updNPCs(dt,tm);updWalkers(dt);updCust(dt);updKitchen(dt,tm);if(!making&&phase==='play')spawnTick(dt);remindTick(dt);marketTick(dt);if(!testFreeze){updFish(dt,tm);updHold(dt);updWater(dt);}updSprays(dt);updCCN(dt,tm);updTerr(dt,tm);syncPondVis(tm,dt);
 hub.rotation.z+=dt*0.35;cabins.forEach(function(c){c.rotation.z=-hub.rotation.z;});ufo.position.y=3+Math.sin(tm*1.6)*0.18;ufo.rotation.y+=dt*(beam.visible?3:0.8);ufoFade(dt);fadeTick(dt);
 dayNight(dt);

 camUpdate(dt);
 if(D0&&D0.shown<D0.full.length){D0.shown=Math.min(D0.full.length,D0.shown+dt*30);$('dlgT').textContent=D0.full.slice(0,Math.floor(D0.shown));if(D0.shown>=D0.full.length)endLine();}
 rsT+=dt;if(rsT>0.5){rsT=0;var si=starInfo();$('rstat').innerHTML='美觀 <span class="stars">'+starStr(si.beauty)+'</span>　款式 <span class="stars">'+starStr(si.variety)+'</span>　味道 <span class="stars">'+starStr(si.taste)+'</span>';drawMenu(si.av);}
 saveT+=dt;if(saveT>8){saveT=0;save();}
 rd.render(SCN[where],cam);requestAnimationFrame(loop);}

// ================= 開始 =================
syncFarm();
if(!S.mk.list.length||Date.now()>=S.mk.next)restock();
if(!S.jobs.list.length||Date.now()>=S.jobs.next)refreshJobs();
growFarm();pondTick();prevSt=S.plots.map(plotState);
applyDeco();buildStoves();syncFridge();syncChefs();drawBoard();drawMenu(availDishes());coinsUI();clk();nk=nt;setInterval(clk,15000);resize();npcPick();
noCull(scO);noCull(scI);noCull(scC);

})();
