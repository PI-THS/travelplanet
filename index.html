<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- iPhone Safari 冇 element fullscreen API：由「分享 → 加入主畫面」開就會冇工具列（同旅款亂Upper 一樣）-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>真．旅遊星球</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#bde7ff;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body{font:15px/1.6 -apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;color:#5a4632;}
button{font:inherit;cursor:pointer;}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;}
#cv{display:block;width:100%;height:100%;}
.pill{background:rgba(255,250,235,.95);color:#5a4632;border:none;border-radius:999px;padding:5px 14px;font-size:14px;line-height:1.5;box-shadow:0 2px 0 rgba(90,70,50,.14);white-space:nowrap;}
button.pill:active{transform:translateY(1px);}
#hudL{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:5;}
/* 畫面上方掣：奶油色立體按鈕＋three.js 立體圖示 */
.hb{border:none;font:inherit;color:#5a4632;background:linear-gradient(180deg,#fffdf7 0%,#f5ead3 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 3px 0 #d9c49c,0 7px 16px rgba(70,50,30,.22);-webkit-tap-highlight-color:transparent;cursor:pointer;}
.hb .ic{display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;}
.hb.money{display:flex;align-items:center;gap:6px;height:46px;padding:0 18px 0 6px;border-radius:23px;font-weight:800;font-size:19px;letter-spacing:.5px;font-variant-numeric:tabular-nums;cursor:default;}
.hb.money .ic{width:38px;height:38px;}
.hb.money.bump{animation:mbump .5s ease-out;}.hb.money.bump .ic{animation:cspin .7s ease-out;}
@keyframes mbump{0%{transform:scale(1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 3px 0 #d9c49c,0 5px 12px rgba(70,50,30,.22);}30%{transform:scale(1.12);box-shadow:inset 0 0 0 2px #ffe27a,0 3px 0 #d9c49c,0 0 18px rgba(255,210,70,.9);}100%{transform:scale(1);}}
@keyframes cspin{from{transform:rotateY(0);}to{transform:rotateY(360deg);}}
.cgain{position:absolute;z-index:7;pointer-events:none;font-weight:900;font-size:19px;color:#2f9e3f;text-shadow:0 2px 0 #fff,0 0 8px rgba(255,255,255,.95);animation:cgain 1.25s ease-out forwards;white-space:nowrap;}
@keyframes cgain{0%{opacity:0;transform:translateY(8px) scale(.7);}15%{opacity:1;transform:translateY(0) scale(1.15);}30%{transform:translateY(-4px) scale(1);}100%{opacity:0;transform:translateY(-30px);}}
.hb.sq{position:relative;width:60px;height:60px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.hb.sq .ic{width:38px;height:38px;margin-top:-1px;}
.hb.sq span{font-size:11.5px;font-weight:800;line-height:1;margin-top:1px;letter-spacing:1px;}
button.hb:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 1px 0 #d9c49c,0 3px 8px rgba(70,50,30,.2);}
/* 拖動移動：手指開始位置有淡淡圓圈（放手就消失） */
/* 開場動畫 */
#story{position:absolute;inset:0;display:none;z-index:14;pointer-events:none;}#story.on{display:block;}
.st-cap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));width:min(580px,calc(100% - 32px));background:rgba(24,20,44,.78);color:#fffaeb;border-radius:20px;padding:16px 18px 12px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.st-tag{font-size:12px;letter-spacing:3px;color:#f4c542;font-weight:800;margin-bottom:4px;}
.st-txt{font:700 18px/1.65 "Noto Serif TC","Songti TC",serif;min-height:3.3em;}
.st-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.st-row button{border:0;border-radius:999px;font:inherit;font-weight:800;cursor:pointer;}
.st-skip{background:transparent;color:rgba(255,250,235,.7);padding:8px 12px;}
.st-next{background:#f4c542;color:#3b2a07;padding:9px 22px;box-shadow:0 3px 0 #c99a1e;}
.story #hudL,.story #hudR,.story #abtn,.story #hint,.story #toasts,.story #tring,.story #tdot,.story #dlg{display:none!important;}
/* 雜誌（刊名「星旅」）*/
#panel.mag{background:#fbf7ee;background-image:radial-gradient(rgba(120,90,50,.05) 1px,transparent 1px);background-size:5px 5px;}
#panel.mag .ph h2{font:900 26px/1.1 "Noto Serif TC","Songti TC",serif;letter-spacing:6px;color:#c9503f;}
#panel.mag .tabs{flex:none;gap:0;flex-wrap:nowrap;overflow-x:auto;border-bottom:2px solid #2d2a32;margin:0 16px 10px;padding:0;scrollbar-width:none;}
#panel.mag .tab{flex:none;background:none!important;border-radius:0;padding:8px 10px 7px;color:#8a7560;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-2px;box-shadow:none;}
#panel.mag .tab.on{color:#c9503f;border-bottom-color:#c9503f;}
.mcov{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#3a4a6a;box-shadow:0 12px 28px rgba(40,30,20,.28);cursor:pointer;margin-bottom:14px;}
.mcov .mph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;padding:0;}
.mcov .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);}
.mcov .mast{position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;font:900 min(18vw,86px)/1 "Noto Serif TC","Songti TC",serif;letter-spacing:.18em;text-shadow:0 3px 14px rgba(0,0,0,.35);}
.mcov .iss{position:absolute;left:0;right:0;top:calc(14px + min(18vw,86px) + 4px);text-align:center;color:#fff;font-size:11px;letter-spacing:2px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.mcov .bdg{position:absolute;right:10px;top:42%;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.mcov .bd{display:flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;color:#3a2a10;font:900 14px/1.1 "Noto Serif TC",serif;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.85);}
.mcov .bd small{font:700 9px/1.2 sans-serif;letter-spacing:1px;}.mcov .bd.red{background:#c9503f;color:#fff;}.mcov .bd img{width:30px;height:30px;margin-top:-4px;}
.mcov .cls{position:absolute;left:12px;right:96px;bottom:34px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.mcov .cl{background:rgba(255,252,244,.94);color:#2d2a32;padding:5px 10px 6px;font:700 14px/1.35 "Noto Serif TC","Songti TC",serif;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.mcov .cl b{display:block;color:#c9503f;font:800 10px/1.3 sans-serif;letter-spacing:2px;}.mcov .cl.big{font-size:17px;}
.mcov .own{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.mnum{border-top:3px solid #2d2a32;padding-top:8px;}.mnum h3,.alist h3{font:900 16px/1.4 "Noto Serif TC",serif;margin:0 0 8px;letter-spacing:2px;}
.mnum .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}.mnum .g div{background:#fff;border-radius:10px;padding:8px 6px;text-align:center;}
.mnum b{display:block;font:900 20px/1.2 "Noto Serif TC",serif;color:#c9503f;}.mnum span{font-size:11px;color:#8a7560;}
.art{color:#2d2a32;font-size:15.5px;line-height:1.85;}
.tbox{margin:12px 0 22px;padding:10px 12px;border-radius:12px;background:#eef8e6;border:2px solid #7fc66e;font-size:14px;line-height:1.65;color:#2d4a1e;}.tbox.no{background:#fff3e2;border-color:#f4a53c;color:#6a4a1a;}
.art .kick{display:inline-block;background:#c9503f;color:#fff;font-weight:800;font-size:12px;letter-spacing:2px;padding:2px 9px;margin-bottom:6px;}
.art h1{font:900 25px/1.3 "Noto Serif TC","Songti TC",serif;margin:2px 0 6px;}
.art .dek{font:700 16px/1.5 "Noto Serif TC","Songti TC",serif;color:#6a5a48;margin-bottom:8px;}
.art .by{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#8a7560;border-top:1px solid #d8ccb0;border-bottom:1px solid #d8ccb0;padding:4px 0;margin-bottom:12px;}
.art figure{margin:0 0 12px;}.art figure img{width:100%;display:block;border-radius:3px;box-shadow:0 4px 12px rgba(40,30,20,.18);}.art figcaption{font-size:12px;color:#8a7560;margin-top:5px;border-left:3px solid #c9503f;padding-left:6px;}
.art p{margin:0 0 10px;text-align:justify;}.art p.lead::first-letter{float:left;font:900 48px/0.95 "Noto Serif TC","Songti TC",serif;color:#c9503f;margin:5px 7px 0 0;}
.art blockquote{margin:14px 0;padding:10px 14px;border-left:4px solid #c9503f;background:#fff1e0;font:700 16.5px/1.6 "Noto Serif TC","Songti TC",serif;}
.art blockquote cite{display:block;font:500 12px/1.4 sans-serif;color:#8a7560;margin-top:4px;font-style:normal;}
.qsec{margin:0 0 14px;}.qsec h3{font:900 16px/1.4 "Noto Serif TC",serif;margin:6px 0 8px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #2d2a32;padding-bottom:4px;}.qsec h3 small{font:600 12px sans-serif;letter-spacing:0;color:#8a7560;}
.qrow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:9px 11px;margin-bottom:7px;}.qrow.ok{box-shadow:0 0 0 2px #f4c542;}.qrow.got{opacity:.6;}.qrow.bonus{background:#fff7de;}
.qt{flex:1;min-width:0;}.qt b{display:block;font-size:15px;}.qt span{display:block;font-size:13px;color:#5a4632;line-height:1.45;}.qt small{display:block;font-size:12px;color:#8a7560;margin-top:2px;}
.qbar{height:8px;border-radius:4px;background:#efe6d2;overflow:hidden;margin-top:5px;}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd66b,#4fa34a);}
.qbtn{flex:none;border:0;border-radius:999px;padding:8px 13px;font:700 14px sans-serif;background:#e9e2d2;color:#8a7560;}.qbtn.on{background:#f4a53c;color:#fff;box-shadow:0 3px 0 #c9822a;}
.alist{margin-top:16px;border-top:3px solid #2d2a32;padding-top:8px;}.alist .ai{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;color:#2d2a32;cursor:pointer;}
.alist .ai .k{display:inline-block;font-size:10px;font-weight:800;color:#c9503f;letter-spacing:1px;margin-right:6px;}.alist .ai b{font:700 15px/1.4 "Noto Serif TC",serif;}.alist .ai small{display:block;color:#8a7560;font-size:11px;}
.mintro{font-size:13.5px;line-height:1.7;color:#5a4632;background:#fff;border-left:4px solid #c9503f;padding:8px 12px;margin-bottom:12px;}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}.mchip{border:1.5px solid #2d2a32;background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;color:#2d2a32;cursor:pointer;}.mchip.on{background:#2d2a32;color:#fbf7ee;}
.mhead{font-size:13px;color:#8a7560;margin-bottom:8px;}.mhead b{font:900 20px/1 "Noto Serif TC",serif;color:#c9503f;}
.letter{position:relative;background:#fff;border-radius:4px;padding:12px 14px 10px 38px;margin-bottom:10px;box-shadow:0 2px 0 rgba(90,70,50,.08);}
.letter .lq{position:absolute;left:10px;top:4px;font:900 34px/1 "Noto Serif TC",serif;color:#e8c9a0;}.letter .lt{font:700 15px/1.65 "Noto Serif TC","Songti TC",serif;color:#2d2a32;}
.letter .lf{display:flex;align-items:center;gap:4px;font-size:12px;color:#5a4632;margin-top:6px;}.letter .lf .stars{margin-left:auto;}.letter .lg{font-size:11px;color:#a08a70;margin-top:2px;}
.srow{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;}.srow .sh{display:flex;justify-content:space-between;align-items:center;}.srow .sh b{font:900 17px/1.3 "Noto Serif TC",serif;}
.srow .sb{height:8px;background:#efe6d2;border-radius:4px;margin:6px 0;overflow:hidden;}.srow .sb i{display:block;height:100%;background:linear-gradient(90deg,#f4c542,#c9503f);border-radius:4px;}
.srow .sd{font-size:12.5px;color:#5a4632;}.srow .si{font-size:11.5px;color:#a08a70;margin-top:3px;}
#panel.mag .kv{background:#fff;border-radius:10px;padding:10px 12px;}#panel.mag .rv{background:#fff;border-radius:4px;border-left:3px solid #c9503f;}
#panel.mag .rv .rvh b{font-family:"Noto Serif TC","Songti TC",serif;}#panel.mag .note{color:#5a4632;}
#tring,#tdot{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s;}
#tring{width:80px;height:80px;box-sizing:border-box;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);}
#tdot{width:28px;height:28px;background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(0,0,0,.15);}
#app.drag #tring,#app.drag #tdot{opacity:1;}
#hudL .row,#hudR .row{display:flex;gap:6px;}
#hudR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:row;align-items:flex-start;gap:8px;z-index:5;}
#bphone{position:relative;}
#badge{display:none;position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#ef5b4c;color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px;font-style:normal;}
#mapv{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);width:min(74vw,340px);background:#fffaeb;border-radius:18px;box-shadow:0 6px 0 rgba(90,70,50,.18),0 10px 24px rgba(40,30,20,.18);padding:8px 8px 6px;z-index:6;display:none;}
#mapv.on{display:block;}#mapv .mvh{display:flex;align-items:center;gap:8px;font-size:14px;color:#5a4632;padding:0 2px 6px;}#mapv .mvh span{flex:1;font-size:12px;color:#8a7560;text-align:right;}
#mapv .mvh button{border:none;background:#f1e6cf;border-radius:50%;width:28px;height:28px;font-size:18px;line-height:28px;padding:0;color:#5a4632;}
#mvC{display:block;width:100%;height:auto;border-radius:12px;background:#58aad2;}
#mapv .mvl{display:flex;gap:10px;align-items:center;font-size:11.5px;color:#6a5a48;padding:5px 2px 0;flex-wrap:wrap;}#mapv .mvl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px;}
.fcoin{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;z-index:9;pointer-events:none;will-change:transform;}
#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8;width:max-content;max-width:92vw;}
.toast{background:rgba(90,70,50,.9);color:#fffaeb;border-radius:999px;padding:6px 16px;font-size:14px;animation:tin .25s ease-out;transition:opacity .4s;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
#abtn{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;background:#f4c542;color:#5a3e00;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #c99a1e;z-index:4;padding:0;}
#abtn b{font-size:28px;line-height:1;}
#abtn span{font-size:13px;line-height:1.3;}
#abtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a1e;}
#hint{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 300px);background:rgba(90,70,50,.82);color:#fffaeb;border-radius:14px;padding:6px 14px;font-size:13px;text-align:center;pointer-events:none;transition:opacity .6s;z-index:3;}
#dlg{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:7;}
#dlgO{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:6px;}
#dlgO button{background:#fffaeb;color:#5a4632;border:2px solid #f4c542;border-radius:999px;padding:6px 18px;font-size:15px;min-width:170px;}
#dlgO button:disabled{opacity:.45;}
#dlgN{display:inline-block;margin-left:22px;padding:3px 16px;border-radius:999px;font-size:14px;font-weight:600;position:relative;top:12px;z-index:1;}
#dlgB{background:#fffaeb;color:#5a4632;border-radius:26px;padding:22px 26px 20px;font-size:16px;line-height:1.75;min-height:84px;position:relative;box-shadow:0 6px 0 rgba(90,70,50,.15);}
#dlgA{position:absolute;right:20px;bottom:8px;color:#e0a526;font-size:13px;}
#dlgP{position:absolute;left:4px;bottom:calc(100% - 18px);width:66px;height:66px;border-radius:50%;background:#fffaeb center 40%/118% no-repeat;border:4px solid #fffaeb;box-shadow:0 3px 0 rgba(90,70,50,.18);display:none;z-index:2;}
#dlg.hasP #dlgP{display:block;}
#dlg.hasP #dlgN{margin-left:80px;}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,94vw);max-height:min(86vh,700px);background:#fffaeb;border-radius:26px;box-shadow:0 8px 0 rgba(90,70,50,.22);display:none;flex-direction:column;z-index:9;overflow:hidden;}
#panel.on{display:flex;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 8px;}
.ph h2{margin:0;font-size:19px;line-height:1.4;}
.ph .sub{font-size:13px;color:#8a7560;}
.x{border:none;background:#f1e6c8;border-radius:50%;width:38px;height:38px;font-size:18px;color:#5a4632;flex:none;}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap;}
.tab{border:none;border-radius:999px;padding:6px 16px;background:#f1e6c8;color:#5a4632;}
.tab.on{background:#f4c542;color:#4a3000;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.chip{border:2px solid #f1e6c8;background:#fff;border-radius:999px;padding:4px 14px;color:#5a4632;}
.chip.on{border-color:#f4c542;background:#fff4cf;}
.pb{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.note{font-size:13px;color:#8a7560;margin:0 2px 10px;line-height:1.6;}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;}
.card.cur{box-shadow:inset 0 0 0 3px #f4c542;}
.sw{width:54px;height:54px;border-radius:12px;flex:none;background:#f3eee2 center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;}
.sw.ico{background-color:#f6efe0;background-position:center;background-size:84%;background-repeat:no-repeat;}
.sico{width:20px;height:20px;vertical-align:-5px;margin-right:3px;display:inline-block;}
.ci{flex:1;min-width:0;}
.ci b{display:block;font-size:15px;}
.ci small{display:block;color:#8a7560;font-size:13px;line-height:1.55;}
.ci small .good{color:#3f8f3a;font-weight:600;}.ci small .bad{color:#d9534f;}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52%;}
.btns.col{flex-direction:column;align-items:stretch;max-width:none;flex:none;}
.act{border:none;border-radius:999px;padding:7px 13px;background:#7fc66e;color:#fff;white-space:nowrap;font-size:14px;}
.act.o{background:#f4a53c;}
.act.g{background:#b9ad96;}
.act:disabled{background:#e4dccb;color:#fff;cursor:default;}
.ok{color:#3f8f2f;}.bad{color:#c9503f;}.lock{color:#9a8a74;}

 for(var k in SITEMS){var it=SITEMS[k];pts[it.s]+=senseLv(k);mx[it.s]+=it.L.length-1;}var o={};SENSES.forEach(function(se){o[se.k]=1+4*pts[se.k]/mx[se.k];});o.avg=(o.vis+o.touch+o.sound+o.smell+o.temp)/5;return o;}

function wpick(L){var t=0;L.forEach(function(x){t+=x.w;});var r=Math.random()*t;for(var i=0;i<L.length;i++){r-=L[i].w;if(r<=0)return L[i];}return L[0];}
function cohenOf(k){for(var i=0;i<COHEN.length;i++)if(COHEN[i].k===k)return COHEN[i];return COHEN[1];}
function genOf(k){for(var i=0;i<GENS.length;i++)if(GENS[i].k===k)return GENS[i];return GENS[3];}
function relOf(k){for(var i=0;i<RELIG.length;i++)if(RELIG[i].k===k)return RELIG[i];return RELIG[0];}
// 旅客類別分佈跟生命週期：投入階段多探險、漫遊；越成熟越多旅行團
function rollProfile(){var st=S.butler?S.butler.st:1,cw=[[0,0,0,0],[8,22,40,30],[20,40,28,12],[38,40,16,6],[45,38,12,5],[30,40,20,10],[35,40,17,8]][st]||[25,35,25,15];
 var c=wpick(COHEN.map(function(x,i){return {k:x.k,w:cw[i]};})).k;return {co:c,gen:wpick(GENS).k,rel:wpick(RELIG).k};}
// 菜式標籤：清真（冇豬肉、酒精）、素食（冇肉、魚、蛋）、冇牛肉
function dishTags(r){var has=function(k){return r.ks.indexOf(k)>=0;};return {halal:!has('pork'),veg:!has('pork')&&!has('beef')&&!has('fish')&&!has('egg'),nobeef:!has('beef')};}
function fitsDiet(r,rel){var need=relOf(rel).need;return !need||dishTags(r)[need];}
function tagLine(r){var t=dishTags(r),L=[];if(t.halal)L.push('☪️ 清真');if(t.veg)L.push('🥬 素食');if(t.nobeef)L.push('🐄 無牛肉');return L.join('　');}

var MENU_CAP=6;
function onMenu(r){return S.menu.indexOf(r.id)>=0;}
function menuAdd(r){if(onMenu(r))return true;if(S.menu.length>=MENU_CAP){toast('📋 餐單已滿（最多 '+MENU_CAP+' 款）：先下架一款，才可以加入新菜');return false;}S.menu.push(r.id);save();return true;}
function menuDel(r){var i=S.menu.indexOf(r.id);if(i>=0){S.menu.splice(i,1);save();toast('📋 「'+r.n+'」已經下架（菜譜仍然保留，可以隨時再上架）');}}
function recipeById(id){for(var i=0;i<S.recipes.length;i++)if(S.recipes[i].id===id)return S.recipes[i];return null;}
function dayKey(t){var d=t?new Date(t):new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dayRec(k){k=k||dayKey();if(!S.stats[k])S.stats[k]={n:0,served:0,angry:0,rev:0,cost:0,co:{},gen:{},rel:{},miss:{},dish:{}};return S.stats[k];}
function pruneStats(){var keys=Object.keys(S.stats).sort();while(keys.length>70){delete S.stats[keys.shift()];}}
function dishCost(r){var c=0;r.ks.forEach(function(k){c+=ING[k].v;});return c;}
// 近 N 日合計
function sumDays(n,off){var o={n:0,served:0,angry:0,rev:0,cost:0,co:{},gen:{},rel:{},miss:{},dish:{}},now=Date.now();off=off||0;
 for(var i=off;i<off+n;i++){var r=S.stats[dayKey(now-i*86400000)];if(!r)continue;['n','served','angry','rev','cost'].forEach(function(k){o[k]+=r[k]||0;});
  ['co','gen','rel','miss'].forEach(function(g){for(var k in r[g])o[g][k]=(o[g][k]||0)+r[g][k];});for(var d in r.dish){var x=o.dish[d]||(o.dish[d]={n:0,rev:0,cost:0});x.n+=r.dish[d].n;x.rev+=r.dish[d].rev;x.cost+=r.dish[d].cost;}}return o;}

// 星期（星期一開始）：本地時間計；第幾期由玩家開始玩嗰個星期起計
function weekNo(t){var d=new Date(t||Date.now());return Math.floor((Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)+3)/7);}
function weekStart(w){var d=new Date((w*7-3)*86400000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
function foodTr(){return FOOD_TR[(weekNo()*5)%FOOD_TR.length];}
function travelTr(){return TRAVEL_TR[(weekNo()*3+1)%TRAVEL_TR.length];}
function travelOk(){try{return !!travelTr().ok();}catch(e){return false;}}
function trendOn(){var F0=foodTr();return {kind:F0.kind,tag:F0.tag,ing:F0.ing,n:F0.n,until:weekStart(weekNo()+1).getTime()};}
function trendFits(r){var t=trendOn();if(!t)return false;if(t.kind)return dishKind(r.ks)===t.kind;if(t.tag)return dishTags(r)[t.tag];if(t.ing)return r.ks.indexOf(t.ing)>=0;return false;}
